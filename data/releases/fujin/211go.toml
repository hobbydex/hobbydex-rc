notes = "The maker's shop lists it as 1/10 電動4WD RC 211GOシャーシ (211GO Chassis) at 26,040 yen, entered 2009-11-10: graphite main chassis and upper deck, metal bulkheads and motor mount, double belt drive, ball differential. Length 300 mm, width 165 mm, height 100 mm, wheelbase 203-211 mm, track F147/R146 mm, gear ratio 1:2.05; body, 540 motor, 7.2V battery and speed controller not included. 3Racing, the sole agent, introduces it as Fujin's first car; its photos of the car are filed as FUJIN-83085."
