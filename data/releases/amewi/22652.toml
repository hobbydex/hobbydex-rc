notes = "Release year unknown; on amewi.com when read (2026-10-13). CT10 Chassis mit Seilwinde & Hobbywing ESC. Technische Daten: Maßstab: 1:10; Länge: 568mm; Breite: 250mm; Höhe: 272mm; Gewicht: 3397g ohne Akku; Radstand: 313mm; Spurbreite vorne: 202mm; Spurbreite hinten: 202mm; Bodenfreiheit: 55mm; Vorderräder: Außendurchmesser/Breite 118/45mm; Hinterräder: Außendurchmesser/Breite 118/45mm; Felgendurchmesser: 51mm; Getriebe: 2-Gang-Metallgetriebe; Übersetzung 1. Gang: 25,85:1; Übersetzung 2. Gang: 64,6:1; Dämpfer vorne: 90mm Aluminium-Öldruckdämpfer mit Rändelschrauben; Dämpfer hinten: 90mm Aluminium Öldruckdämpfer mit Rändelschrauben; Bremse: Elektronisch, Mountainbreak (Hinweis: hinterer Jumper am Regler muss für Aktivierung der Mountainbreak entfernt werden); Regler: Hobbywing WP1060 60A Brushed; Motor: 540er Brushed 45T; Antriebssystem: Kardan; Lenkservo: Standard MG 25kg; Hauptmaterial: Kunststoff; Akkufach Abmessungen: 160x45x25mm; Fahrzeit: Je nach Kapazität des gewählten Akkus bis zu 120 Minuten; Höchstgeschwindigkeit: ca. 15km/h im zweiten Gang; Fernsteuerung: 6 Kanäle, 2,4GH; Reichweite: ca. 100 Meter. Lieferumfang: Modell, Fernsteuerung, Diverses Zubehör, Anleitung DE/EN"
