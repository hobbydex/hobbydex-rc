notes = "Release year unknown; on amewi.com when read (2026-10-13). CT10 Chassis with Winch & Hobbywing ESC. Specifications: Scale: 1:10; Length: 568mm; Width: 250mm; Height: 272mm; Weight: 3397g without battery; Wheelbase: 313mm; Track width front: 202mm; Track width rear: 202mm; Ground clearance: 55mm; Front wheels: outer diameter/width 118/45mm; Rear wheels: outer diameter/width 118/45mm; Rim diameter: 51mm; Gearbox: 2-speed metal gearbox; Gear ratio 1st gear: 25,85:1; Gear ratio 2nd gear: 64,6:1; Front shock absorber: 90mm aluminium oil shock absorber with knurled screws; Rear shock: 90mm aluminium oil-pressure shock absorber with knurled screws; Brake: Electronic, Mountainbreak (Note: rear jumper on controller must be removed to activate Mountainbreak); ESC: Hobbywing WP1060 60A Brushed; Motor: 540 Brushed 45T; Drive system: Cardan; Steering servo: Standard MG 25kg; Main material: Plastic; Battery compartment dimensions: 160x45x25mm; Drive time: Depending on the capacity of the selected battery, up to 120 minutes; Top speed: approx. 15km/h in second gear; Remote control: 6 channels, 2,4GH; Range: approx. 100 metres. In the box: Model, Remote control, Various accessories, Manual DE/EN"
