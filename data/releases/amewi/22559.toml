notes = "Release year unknown; on amewi.com when read (2026-10-13). Technische Daten: Maßstab: 1:10; Länge: 630mm; Breite: 245mm; Höhe Chassis: 260mm; Gewicht: ausgerüstet ca. 4,2kg; Radstand: 330 / 126mm; Spurbreite vorne: 210mm; Spurbreite hinten: 210mm; Bodenfreiheit: 70mm; Vorderräder: Außendurchmesser/Breite 116/42mm; Hinterräder: Außendurchmesser/Breite 116/42mm; Felgendurchmesser: 55mm; Getriebe: 2-Gang; Übersetzung 1. Gang: 1:33.0; Übersetzung 2. Gang: 1:13.4; Dämpfer vorne: Länge 95mm Öldruck mit Rändelmutter für die Federspannung; Dämpfer hinten: Länge 95mm Öldruck mit Rändelmutter für die Federspannung; Bremse: Elektronisch; Regler: Hobbywing WP880 inkl. Programmierkarte; Motor: 600er Brushed Crawler Motor; Antriebssystem: Kardan; Lenkservo: 21kg Metallgetriebe JX Servo; Schaltservo und Differentialsperren: 3x Midi 0,9kg MG; Hauptmaterial: Aluminium / Kunststoff; Akkufach Abmessungen: 160 x 48 x 30mm; Akku: nicht enthalten; Fahrzeit: je nach gewähltem Akku 30 bis 120 Minuten; Höchstgeschwindigkeit: ca. 20 km/h im zweiten Gang; Sender: 6-Kanal 2,4GHz; Betriebsfrequenz: 2410 bis 2472 MHz / 20dBm; Reichweite: ca. 150m; Ladegerät: nicht enthalten; Ladezeit: je nach Akkutyp und gewähltem Ladegerät. Lieferumfang: Modell, Fernsteuerung, Anleitung DE/EN, Werkzeug"
