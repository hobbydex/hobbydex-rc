notes = "Release year unknown; on amewi.com when read (2026-10-13). Technische Daten: Maßstab: 1:7; Länge: 680mm; Breite: 380mm; Höhe: 225mm; Gewicht: ca. 6,2kg; Radstand: 419mm; Spurbreite vorne: 330mm; Spurbreite hinten: 320mm; Bodenfreiheit: 55mm; Vorderräder: Außendurchmesser/Breite 165/63mm; Hinterräder: Außendurchmesser/Breite 165/63mm; Felgendurchmesser: 90mm; Getriebe: Stahl; Übersetzung: 15:1; Dämpfer vorne: 102mm; Dämpfer hinten: 102mm; Bremse: elektronisch und Bremsscheibe über 15kg Metallgetriebe Servo angesteuert; Regler: 150A ESC mit XT90 Anschluss; Motor: 4282 Brushless Motor mit 2000KV; Antriebssystem: Kardanwelle aus Metall; Lenkservo: Standard Servo mit Metallgetriebe und 25kg Stellkraft; Hauptmaterial: Metall; Akkufach Abmessungen: 140 x 45 x 50mm; Akku: 2x LiPo, 3S, 11,1V, 5000mAh 35C, Softcase XT90-Stecker, 140x40x25mm, 350g; Fahrzeit: ca. 10-15min; Höchstgeschwindigkeit: bis max. 130km/h (mit 2x 4S LiPo Akkus optional); Fernsteuerung: 4-Kanal 2,4GHz Fernsteuerung; Reichweite: max. 400m; Ladegerät: BX3 Balancer Ladegerät 220V; Ladezeit: pro Akku ca. 3-4h. Lieferumfang: Modell, Sender, 2x Akku 3S LiPo, Handbremssystem mit allen erforderlichen Anbauteilen, Ladegerät, Dekorbogen, Anleitung DE/EN"
