notes = "Release year unknown; on amewi.com when read (2026-10-13). Specifications: Scale: 1:7; Length: 680mm; Width: 380mm; Height: 225mm; Weight: approx. 6.2kg; Wheelbase: 419mm; Front track width: 330mm; Rear track width: 320mm; Ground clearance: 55mm; Front wheels: outer diameter/width 165/63mm; Rear wheels: outer diameter/width 165/63mm; Rim diameter: 90mm; Transmission: steel; Gear ratio: 15:1; Front shocks: 102mm; Rear shocks: 102mm; Brake: electronic and brake disc controlled by 15kg metal gear servo; ESC: 150A with XT90 connector; Motor: 4282 brushless motor with 2000KV; Drive system: metal drive shaft; Steering servo: standard servo with metal gear and 25kg torque; Main material: metal; Battery compartment dimensions: 140 x 45 x 50mm; Battery: 2x LiPo, 3S, 11.1V, 5000mAh 35C, softcase XT90 connector, 140x40x25mm, 350g; Driving time: approx. 10-15min; Top speed: up to max. 130km/h (with 2x 4S LiPo batteries optional); Remote control: 4-channel 2.4GHz remote control; Range: max. 400m; Charger: BX3 balancer charger 220V; Charging time: per battery approx. 3-4h. In the box: Model, Transmitter, 2x 3S LiPo battery, Handbrake system with all necessary mounting parts, Charger, Decal sheet, Manual DE/EN"
