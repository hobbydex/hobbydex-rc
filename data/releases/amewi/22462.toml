notes = "Release year unknown; on amewi.com when read (2026-10-13). With Tracked Undercarriage and Metal Cage. Specifications: Scale: 1/10; Length: 530mm; Width: 220mm; Height: 270mm; Wheelbase: 313mm; Ground clearance: min. 50mm; Wheel diameter: 110mm; High Grip Super Soft tyres; Rim diameter: 62mm; Weight without battery: approx. 3.2kg; Motor: 21T 550 brushed; ESC: Hobbywing WP-1060 (Li-Po capable) Deans T-plug; Remote control: 2.4GHz, 4-channel; Body: 1.2mm PVC painted; Frame: 5mm CNC aluminium 6061; Linkage: metal; CVD drive shafts; portal axles. In the box: Completely assembled car, 4x track chassis, Adapter for the track chassis (e.g. for mounting on TRX4 and SCX10), Remote control, Instructions in DE/EN"
