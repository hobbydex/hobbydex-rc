notes = "Release year unknown; on amewi.com when read (2026-10-13). 95+km/h, Hobbywing EzRun MAX6 160A 8S ESC. Technische Daten: Maßstab: 1:7; Länge: 700mm; Breite: 510mm; Höhe: 310mm; Gewicht: ca. 8000g; Radstand: 430mm; Spurbreite vorne: 400mm; Spurbreite hinten: 400mm; Bodenfreiheit: 90mm; Vorderräder: Außendurchmesser/Breite 188/102mm; Hinterräder: Außendurchmesser/Breite 188/102mm; Felgendurchmesser: 110mm; Getriebe: Stahl; Dämpfer vorne: 135mm; Dämpfer hinten: 145mm; Getriebe: Stahl; Übersetzung: 16,5:1; Bremse: Elektronisch/Motor; Regler: Hobbywing EzRun MAX6 160A 8S ESC; Motor: Rocket 4292 1450kv; Antriebssystem: Kardan (Stahl); Lenkservo: Standardgröße, Metallgetriebe, 35kg Stellkraft, 25T Metall Servohorn; Hauptmaterial: CNC-gefrästes Aluminium; Akkufach Abmessungen: 160x50x60mm; Akku: Empfohlen werden 2x 3S oder 2x 4S LiPo-Akku mit min. 5000mAh 30C; und XT90-Kontakten; Fahrzeit: Bis zu 15min, je nach gewähltem Akku; Höchstgeschwindigkeit: ca. 95+km/h (8S LiPo) bzw. 80km/h (6S LiPo); Fernsteuerung: 2,4GHz, 4-Kanal, mit Dual Rate für Lenkung und Gas (beide Richtungen getrennt regelbar); Reichweite: ca. 100-150m. Lieferumfang: Modell, Fernsteuerung, Diverses Zubehör, Bedienungsanleitung DE/EN"
