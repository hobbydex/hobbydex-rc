notes = "Release year unknown; on amewi.com when read (2026-10-13). 95+km/h, Hobbywing EzRun MAX6 160A 8S ESC. Specifications: Scale: 1:7; Length: 700mm; Width: 510mm; Height: 310mm; Weight: approx. 8000g; Wheelbase: 430mm; Track width front: 400mm; Track width rear: 400mm; Ground clearance: 90mm; Front wheels: Outer diameter/width 188/102mm; Rear wheels: Outer diameter/width 188/102mm; Rim diameter: 110mm; Gearbox: Steel; Front shocks: 135mm; Rear shocks: 145mm; Gearbox: steel; Gear ratio: 16,5:1; Brake: Electronic/Motor; ESC: Hobbywing EzRun MAX6 160A 8S ESC; Engine: Rocket 4292 1450kv; Drive system: Cardan (steel); Steering servo: Standard size, metal gearbox, 35kg actuating force, 25T metal servo horn; Main material: CNC machined aluminium; Battery compartment dimensions: 160x50x60mm; Battery: Recommended are 2x 3S or 2x 4S LiPo battery with min. 5000mAh 30C; and XT90 contacts; Ride time: Up to 15min, depending on battery selected; Top speed: approx. 95+km/h (8S LiPo) or 80km/h (6S LiPo); Remote control: 2.4GHz, 4-channel, with dual rate for steering and throttle (both directions can be controlled separately); Range: approx. 100-150m. In the box: Model, Remote control, Various accessories, Operating instructions DE/EN"
