# Tamiya part numbers whose Tamiya USA shop spare page names another item (tamiya-usa-spare-mismatch), checked by
# eye against Tamiya's own manuals, 2026-11-05. A pair (part, usa) listed here leaves the audit class; the USA page
# is not linked. verdict:
#   usa-wrong      our record is right; the USA page under this number describes another item
#   same-item      the same size and kind of screw or rod; Tamiya prints it with another word (name kept)
#   kit-position   Tamiya prints the number Front in some kits and Rear in others (one coil spring, name kept)
#   reused-number  two Tamiya kits print two different rods under one number (our record kept)
# evidence: the manual records whose printed parts list shows the number (the page is in the note).
# audit.py usa_spare_reviewed reads this file.

[[reviewed]]
part = "part/tamiya/13455376"
usa = "https://www.tamiyausa.com/shop/7-digit-spare-parts/rc-6x18mm-axle-spacer-58367/"
verdict = "usa-wrong"
evidence = ["doc/tamiya/58367-manual", "doc/tamiya/47374-manual-de", "doc/tamiya/84122-manual-de"]
note = "58367 parts list p20 prints 8x16mm Spacer (ME2 x1) for this number; the kit has no 6x18 axle spacer."

[[reviewed]]
part = "part/tamiya/19803476"
usa = "https://www.tamiyausa.com/shop/7-digit-spare-parts/rc-2x18mm-cs-hex-screw-42384/"
verdict = "usa-wrong"
evidence = ["doc/tamiya/42384-manual", "doc/tamiya/42391-manual"]
note = "42384 parts list p32 prints 3x18mm Countersunk Head Hex Screw (MA5 x5); the USA page says 2x18."

