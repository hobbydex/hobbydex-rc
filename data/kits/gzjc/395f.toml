notes = "95% metal tracked excavator, about 55 kg: dual pump (2x 1 mL/r with 6354 brushless motors and 80A ESCs), 6-way valve with relief valve (3 ways for attachments), 20 mm boom and arm cylinders, 2830 brushless drive and swing motors, manual quick coupler. Attachments sold separately, without part numbers: grading, trapezoidal, narrow toothless, narrow toothed, rake and grille buckets (also for the LR976 and E650), a 270-degree rotating hydraulic shear, an electric hammer and a ripper (shear and hammer also for the LR976). Data from a retailer's listing (Toucan Hobby)."
