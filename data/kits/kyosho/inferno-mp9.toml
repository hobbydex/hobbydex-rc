notes = "TKI (Team Kyosho Inferno) names the successive works revisions of the MP9: TKI2, TKI3, TKI4 and TKI4 V2. Spec A is the version sold with the higher-spec option parts fitted; WC marks the World Champion limited editions; readysets are the RTR versions. The 1/24 Mini-Z Buggy readysets that wear an Inferno MP9 TKI body are on the Mini-Z Buggy kit."
