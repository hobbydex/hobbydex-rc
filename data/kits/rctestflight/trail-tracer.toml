notes = "The Trail Tracer is not a car: it is an add-on system (Transmitter Board, Receiver Board, sensor coil, and optional Charge Port and Beacon Tx boards) that fits any R/C car with an ESC and a standard PWM steering servo, per the maker's page. category car is the closest type the schema has for a vehicle add-on; the maker sells no car with it. Sold as the Basic, Advanced and Rx sets (releases of this kit)."
