notes = "Own label of the German RC shop Tamico (tamico.de, Wustermark): shock oils and diff syrups, thread lock, 3D license plates and decal sheets for 1/10 bodies, light buckets for Tamiya bodies, rear axle bump stops for the Tamiya CW-01, body holders, parts boxes, a servo and a pit mat. Country DE: tamico.de's product-safety notice names Tamico OHG, Nauener Str. 1, 14641 Wustermark, Germany as the maker of these items (read 2026-11-18). No website is set: the items are sold only in the shop's own store, which is a provenance note only (decisions.md, Tamico)."
