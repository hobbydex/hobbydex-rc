notes = "Polycarbonate (Lexan) race bodies and wings from Team Titan (TiTAN Precision R/C Model Co. Ltd., Taichung, Taiwan, also the maker of ARC cars): 1/10 touring car, FWD, M-chassis and 200 mm bodies, 1/12 pan car, 1/8 GT, Lola and buggy bodies, plus crawler and short course shells and body accessories. Item numbers are 60xxx, with the thickness as a suffix (60238-05 is 0.5 mm). Team Titan's own sites (team-titan.com.tw, arc-rc.com.tw) did not answer on 2026-10-11; the data comes from LMI Racing, its European distributor. Country from Team Titan's address in Taichung as given in retailers' product safety details."
