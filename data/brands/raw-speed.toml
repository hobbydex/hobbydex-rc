notes = "American maker of tyres and foam inserts for 1/10 and 1/8 off-road racing (buggy, truggy, stadium and short course tyres in clay, carpet and other compounds, drag slicks), started by Jason Snyder and later bought by AJ Schumacher (LiveRC news). Part numbers are the RS/RWS tyre codes. Country US: RC Car Action and RedRC call it a US company that makes its tyres in its own facility in California. Website: Raw Speed's press posts on RedRC (2019 onwards, read 2026-11-18) link rawspeedrc.com, as do LiveRC's."
