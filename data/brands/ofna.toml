notes = "Radio-controlled nitro and electric off-road and on-road cars (Hyper, Ultra, Jammin, Nexx, Buggy 8) and the engines, tuned pipes and hop-ups for them. Its own site now answers only a parked-domain page; the catalogue, parts lists and product sheets are read from web.archive.org captures of ofna.com. Country (United States) is the best-supported value: RCScrapyard files the cars as distributed by Ofna (made by Hobao and Hong-Nor); the maker's pages that would state it are queued."
