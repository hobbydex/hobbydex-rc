notes = "Japanese maker of the 211GO 1/10 electric 4WD M-chassis car and its parts, sold from its own yen-priced shop at fujin.co.jp (archived 2009, read 2026-11-17). 3Racing (Hong Kong) was its sole agent and lists the spares as FUJIN-83xxx. Status dormant: the archive holds its site only in 2009 and no later source shows it trading; no closure statement found. Website: www.fujin.co.jp no longer resolves (DNS name not found, 2026-11-17); the site links the archived copy of its home page (2009-12-02 capture)."
