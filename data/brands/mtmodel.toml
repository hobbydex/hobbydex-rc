notes = "Chinese maker of 1/14 RC construction machines, metal and hydraulic: excavators (946, 946-3, EC380), wheeled loaders (E260L, WA480), with FlySky ST8 or PL18EV radios and the maker's own spare and upgrade parts (grab buckets, rippers, telescopic booms, a tray for the radio). Some listings also say MTRC. Part codes are the MTM- SKU prefix. Country CN is a best guess from the Chinese stock and shipping of the listings; no address was found. No official site was found: mtmodel.com timed out, mtmodelrc.com did not resolve, and mtmodel.cn was still queued without an answer (checked 2026-10-22). The data comes from a dealer's listing, RC Construction Vehicle Store (rcconstructionvehicle.com, read 2026-10-22), which sells the models under the vendor MTModel."
