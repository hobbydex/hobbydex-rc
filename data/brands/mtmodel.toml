notes = "Chinese maker of 1/14 RC construction machines, metal and hydraulic: excavators (946, 946-3, EC380, EC380-3, EC950), wheeled loaders (E260L, WA480), with FlySky ST8 or PL18EV radios and the maker's own spare and upgrade parts (grab buckets, rippers, telescopic booms, a tray for the radio). Some listings also say MTRC. Part codes are the MTM- SKU prefix. Country CN is a best guess from the Chinese stock and shipping of the listings; no address was found. No official website was found: mtmodel.com is a parked for-sale domain (reported 2026-11-09; its probe rows were dropped), mtmodelrc.com did not resolve, and mtmodel.cn was still queued without an answer. Sold through dealers: Toucan RC Hobby (www.toucanhobby.com, its Brand-MTModel collection with MTM- SKUs, read 2026-11-09), RC Construction Vehicle Store (rcconstructionvehicle.com, read 2026-10-22), and ScaleDuty (scaleduty.com, MT-Models listings, read 2026-11-09, no item numbers). Heavy Duty RC (heavydutyrc.com) has an MTMODEL collection, but its three items are Liebherr 946 and Volvo EC380 builds with no MTM- code, so it is not counted as a seller of MT Model. No page read says any of these is an official distributor. Dealer records (kind dealer) come from tools/import_dealer_listings.py (Toucan) and tools/import_rcconstruction.py (RC Construction Vehicle Store)."
