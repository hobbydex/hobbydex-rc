notes = "Japanese brand and shop of the designer Jun Watanabe (Tsudanuma, Chiba) around 1980s Tamiya off-road buggies: decal sheets, aluminium bumpers and RC car stands, besides apparel, keychains and a book; Tamiya made Blockhead Motors editions of the Wild One (58695) and Hotshot II (58710). BHM item numbers. Country JP: the maker address on tamico.de's product-safety notice is Hanakumo Inc., Kimura Building, 6-4-9 Tsudanuma (read 2026-11-18). Website: blockheadmotors.stores.jp, the brand's own online store (BHM decal sheets, stickers and parts beside other makers' items), named in Double E's CaDA event video and in RC Car Action's interview with Jun Watanabe; read 2026-11-20."
