notes = "RC car kits (1/6 1941 MB and Type 82 Kubelwagen scalers, Mashigan, Atlas, Cheyenne, Magnum) and spare parts, sold in Europe through the Belgian importer beez2b (www.beez2b.com, manufacturer 601, 514 items). Its parts carry ROCC numbers with the FMS number as the store SKU (FMSC1117), and some state 'same as FMSC....': the owner is FMS on that evidence, not on a statement of ownership. Country CN is a best guess, as for FMS: no cached page names the place of manufacture. The brand site is fmshobby.com (FMS's own shop, first); rochobbies.com is the fallback site (user, 2026-10-24), its SKUs are sale codes, so only a product page whose structured SKU names the part links."
