notes = "LESU Model (佛山市雷鲨模型科技有限公司), Danzao Town, Nanhai District, Foshan, Guangdong (contact page and site footer). Makes 1/14 metal tractor-truck chassis, trucks, trailers and hydraulic construction machines (excavators, loaders, forklifts, dumpers) and many 1/14 truck upgrade parts, most for Tamiya tractor trucks; also 1/10 and 1/16 truck parts. Its About page calls it one of the earliest makers of 1/14 truck option parts in China. Some products carry the name \"Radiance Model\" (LESU Radiance Model). Item numbers such as BA-B0001, LS-A0054, RD-2041, AT-C0077, G-6156-C."
