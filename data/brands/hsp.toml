notes = "Hi Speed HSP Racing: a large generic Chinese RC platform (RTR and kit cars, spare parts). Himoto, early Redcat and many rebrands share its parts, so it is kept as a cross-reference anchor. Country not yet set: no page of the maker names its place of business. Its former site www.hspracing.com no longer answers; hsprc.com is a dealer (RC Toys shop, Shantou), not the maker, so no website is set."
