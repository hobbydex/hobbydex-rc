notes = "Japanese maker of RC drift chassis and parts: the LP-86 1/10 drift chassis kit (DL515), its conversion kits (DLPM M-size, HD transform set) and option parts. Country JP: the maker writes its development blog on Ameblo, a Japanese blog service, as a dealer (Super-G Drift) shows. Website: www.d-like.net, the shop of DRIFT Stage D-Like (Kumamoto), linked from its official X account (@DRIFTStageDLike) and Instagram (drift_stage_dlike). Records are from its shop and rcMart's listings (a Hong Kong dealer)."
