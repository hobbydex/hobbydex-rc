notes = "Japanese maker of RC car parts and accessories: 64 and 48 pitch pinion and spur gears (TCS, DTS), shocks and damper kits (High Big Bore, Revoshock), shock oils, setup tools and the TC10 touring car chassis. Country JP from the dealers (Tonisport: 'the Japanese manufacturer Axon'; Yodobashi and Joshin list it as a Japanese maker). Yokomo sells some AXON-designed gears under its own numbers (SG-A64110A). No site of the maker's own was found (2026-11-20: web search finds only dealers). Records are from rcMart's listings (a Hong Kong dealer)."
