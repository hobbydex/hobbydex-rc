notes = "Japanese maker of RC car parts and accessories: 64 and 48 pitch pinion and spur gears (TCS, DTS), shocks and damper kits (High Big Bore, Revoshock), shock oils, setup tools and the TC10 touring car chassis. Country JP from the dealers (Tonisport: 'the Japanese manufacturer Axon'; Yodobashi and Joshin list it as a Japanese maker). Yokomo sells some AXON-designed gears under its own numbers (SG-A64110A). Website: www.team-axon.com, AXON inc.'s own site (Ikebukuro, Toshima, Tokyo; served over http only), named as the maker's site by its dealer Tonisport and by AXON inc.'s Facebook page, with the same address; RedRC credits it. Records are from its product line tables and rcMart's listings (a Hong Kong dealer)."
