notes = "Team STRC: CNC-machined aluminium, brass, steel and graphite hop-up parts for Traxxas, Associated, Axial, Element RC and Redcat vehicles, beadlock rings for Pro-Line wheels, threaded links and tools. Part numbers start with ST (STA Axial, STC Associated and Element RC, STE Redcat, STP Pro-Line, STRA tools) and end in a colour or material code (B blue, GM gun metal, S silver, R red, BK black, BR brass, CF graphite)."
