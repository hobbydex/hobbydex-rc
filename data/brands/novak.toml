notes = "Novak Electronics, Inc., Irvine, California (address in its M2 DIG manual; customer service cs@teamnovak.com). Brushless and brushed ESCs and motors, crawler and touring electronics; renamed Novak R/C in January 2014; closed on 13 June 2016. Its products and manuals come from archived copies of its own site. Website: teamnovak.com carried unrelated blog posts in 2021-2022 (archive captures) and now shows a parking lander (its sitemap, read 2026-11-11); the site links the archived copy of its home page (2016-05-30 capture, before the closure)."
