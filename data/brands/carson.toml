notes = "Carson Modelsport, Fuerth, part of the Simba Dickie Group (Dickie, Tamiya-Carson): RTR cars (Virus, Akuma, Drakuro, King of Dirt, XS, X10, FY8/FY10 lines, licensed toy-grade supercars and Nano Racers), trucks and construction models, spare parts, batteries, chargers and Reflex radios, plus Carson-made option parts for Tamiya chassis. Also the German distributor of Tamiya, whose products are not Carson's. Article numbers are 9 digits (500409080); spare parts sold for one car can carry that car's number with a suffix (409060-01)."
