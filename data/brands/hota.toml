notes = "Smart chargers for RC batteries from Shenzhen (Longhua): dual-channel chargers (D6 and D6S DC, D6 Pro, D6+, D6 Ultra, S6 and S6 Ultra AC/DC, P6 DC), four-channel chargers (F6, F6+, F6 Ultra), the H6 Pro single-channel AC/DC charger, the T6, T8 and T8 Ultra compact chargers (the T8 and T8 Ultra with servo tester, ESC and power-supply modes) and power supplies (T240, T330, the H24 GaN adapter). Founded 2008 as an OEM maker of chargers and switching power supplies, its own brand since 2018 (hota-exp.com, About). HOTA prints no article numbers; models are named D6 Pro, F6 Ultra and so on."
