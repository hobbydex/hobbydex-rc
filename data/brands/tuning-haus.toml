notes = "Aftermarket parts for 1/10 F1 and pan cars (Tamiya F104 and TRF101, VBC Flash04 and Wildfire), wheels, washers and LiPo bags; part numbers TUH1003 and up. Sold in the Carisma EU shop. Upgrade parts brand started in 2013 by Bill Jeric (formerly head of Losi). Since 2016, when he joined Hobby Recreation Products (HRP Distributing) as Vice President, the brand and its inventory are part of HRP, which manages, distributes and sells it; HRP also distributes Carisma."
