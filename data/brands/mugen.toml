notes = "Japanese maker (Funabashi, Chiba; founded August 1982) of 1/8 nitro and electric racing buggies and truggies (MBX), 1/8 on-road cars (MRX), 1/10 nitro and electric touring cars (MTX, MTC), 1/10 electric buggies (MSB, MSX), the Ninja engines and their spare parts; part numbers start with a letter for the group (A touring, B accessories and MSB1, C and D older cars, E MBX, H MRX, T MTX). Its own site www.mugenseiki.com (mirror of mugenseiki.co.jp) has an outdated certificate and is read over http; the European office MSE Mugen Seiki Europe (Gelsenkirchen) sells through mugenshop.eu, the US office Mugen Seiki Racing through mugenracing.com (closed to crawlers)."
