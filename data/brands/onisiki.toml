notes = "Mini RC drift cars and parts: the Kodama and Nekomata 1/24-1/28 RWD drift chassis, aluminium chassis parts (Hannya knuckles), drift servos, gyros, brushless motors, LiPo batteries and program boxes under ONI numbers. Country not stated by any source found (RedRC credits a site of its own, not confirmed). No site of the maker's own was found (2026-11-20: web search finds only dealers). Records are from rcMart's listings (a Hong Kong dealer). Of its 128 rcMart listings 77 have a caption that does not print the number, so they are not recorded."
