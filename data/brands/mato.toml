notes = "Chinese maker of 1/16 metal RC tanks with infrared or BB combat, as kits and ready-to-run (Tiger I 1220, Panzer III 1223, StuG III 1226, King Tiger 1228, M4A3 Sherman 1230, M36B1 1231, M36 1236, M10 1210), and of metal upgrade parts for Heng Long tanks. Item numbers are the four-digit model numbers. Country CN: a German dealer's product-safety notice names the maker Shantou Mato Plastic Toys, Huanghe Road 42, Shantou, China (web search, 2026-11-18). No site of the maker's own found (web search finds only dealers: Toucan Hobby, Motion RC)."
