notes = "Chinese maker of metal trailers (DG-995 to DG-999 full, gooseneck, dump and steering trailers) and upgrade parts for 1/14 RC tractor trucks and construction models (Tamiya, LESU and others): LED lamps and light bars, grilles, air filter guards, gearbox parts. Part codes are the DG- numbers. No site of the maker's own was found (2026-11-18: web search finds only dealers: Toucan Hobby). Country CN is a best guess: the dealer ships from China and names no other country."
