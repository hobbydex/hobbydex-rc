notes = "Maker of RC racing parts: 1/10 F1 rubber and foam tyres, Plutonium brushless motors, sensor wires, tyre warmers, vacuum pumps and tyre-sauce bottles (TP- item numbers). Country HK: Team Powers is the own brand of RC Explorer, a Hong Kong company (its distributor's statement; the brand runs the Team Powers Cup at the PYC track in Hong Kong, Red RC 2019). Website: www.team-powers.com, the store of RC Explorer Co. Ltd with the TP parts, credited as Team Powers' source by Red RC and CircusRC and linked from the brand's videos (3Racing's Sakura Zero video on Absima's channel), read 2026-11-20."
