notes = "RUDDOG Products and RUDDOG Racing, the in-house line of the German RC distributor RUDDOG Distribution GmbH (Saaldorf-Surheim, Bavaria; founded in 2006 by Sven Rudig): sensored brushless motors (the RP540 and RP543 series), ESCs, receivers, servos, LiPo packs, nitro engines, pinions, hardware, tools, bags and leads. Item numbers look like RP-0001. Its about page names it the exclusive Central European distributor of Team Associated, Element RC, Reedy, JConcepts, Bittydesign, Factory Team, MIP, Matrix, Xtreme, DE Racing, Intellect, Alpha Plus and Sweep Racing, and its shop also lists LC Racing and ORCA; Revolution Design, Iris and SICK Racing are named as its proprietary brands. Those are separate brands, not RUDDOG's parts."
