notes = "Chinese maker of 1/12 and 1/14 RC construction machines, metal and hydraulic, under the DIM series name: excavators (H2 ZX210, H3, P3), loaders (C950), bulldozers (D65EX), a road roller (CS11), a tracked dump truck (EG110R), a 6x6 articulated truck (K745) and a 4x4 tractor (T150K), with FlySky I6S radios and hobby parts such as quick couplers and wood clamps. Part codes are the JZM- SKU prefix. Country CN is a best guess from the Chinese stock and shipping of the listings; no address was found. No official site was found: jzmodel.com failed the TLS handshake, jzmodel.cn did not resolve, and jzmodelrc.com was still queued without an answer (checked 2026-10-22). The data comes from a dealer's listing, RC Construction Vehicle Store (rcconstructionvehicle.com, read 2026-10-22), which sells the models under the vendor JZModel."
