notes = "Upgrade parts, wheels and tyres, servos, motors, lights, winches, tools and scale accessories for small and 1/10 scale crawlers (Traxxas TRX-4M and TRX-4, Axial SCX24, SCX30 and SCX10, Redcat Ascent-18, FMS FCX18 and FCX24, Losi Micro-B and Micro-T), and crawler trailers. Part numbers are the store's SKUs; a suffix gives the colour (BK black, GL grey, RD red, SR silver) or the position (F front, R rear, FR both). Country from the store's shipping policy: most orders ship from its main warehouse in China, with local warehouses in the US, UK, Germany and Canada."
