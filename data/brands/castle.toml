notes = "ESCs and sensored brushless motors for RC cars (Mamba, Cobra, Copperhead and Sidewinder ESCs; 0808 to 2535 size motors), also aircraft and marine ESCs, BECs and Castle Link programmers; Ghost RC is its speed run line. Part numbers look like 010-0155-00 (ESCs and combos), 060-0085-00 (motors), 011-0014-00 (accessories). Imported: the car ESCs, motors and combos, their accessories and spares (fans, cases, harnesses, sensor wires, endbells, rotor kits, pinions, connectors, wire, programmers) and the CC BECs. Not imported: aircraft and marine ESCs and the accessories made only for them (Phoenix Edge end caps, arming lockout harness, water jacket), Berg receiver crystals, the Castle Serial Link and Castle Gear clothing."
