notes = "Maker of belted pre-mounted tyres and wheels for large-scale RC cars and monster trucks (Terraform, Velociter on Array, Hive and Switch rims) and aluminium hex adaptors (MTD item numbers). Not the full-size Method Race Wheels, whose RC wheels Vanquish makes under licence. No country stated by a source we hold. Website: methodrc.net, Method RC's own Shopify store (its titles and MTD SKUs), named as the brand's site by its UK distributor's brand page (Wheelspin Models) and linked with affiliate codes by the YouTube creators Jason Perrin RC and 3 Sons RC; its parts are read from that store (2026-11-20)."
