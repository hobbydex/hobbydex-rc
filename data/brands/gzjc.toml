notes = "Chinese maker of 1/12 metal hydraulic RC machines: the 395F (C395), LR976, E650 and 323GX excavators and the D155AX bulldozer, with buckets, a hydraulic shear, an electric hammer, a ripper and a big blade sold separately. No site of the maker's own was found: the data comes from a retailer's listing, Toucan Hobby (toucanhobby.com, read 2026-10-12), which sells the machines under its own shop name with GZJC SKUs and calls them GZJC excavators on its bucket listing. Country CN: the machines ship from Toucan's Chinese warehouse. The attachments have no part numbers (only Toucan's descriptive SKUs), so they are listed on the kits, not as parts. The E650 is named only as a bucket fit; Toucan does not sell it."
