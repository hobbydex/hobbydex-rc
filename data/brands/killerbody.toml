notes = "Scale bodies for 1/10 crawlers, touring and rally cars (hard plastic ABS kits and polycarbonate (Lexan) bodies, clear, painted or printed), with their accessories (light buckets, mirrors, interiors, decals, LED sets) and its own Mercury crawler chassis kit; also sells collectibles (helmets, figures) on its store. The home page names rc.killerbody.com, hero.killerbody.com and store.killerbody.com as its official sites. Item numbers are five digits (48xxx), written KB#48765 in fitment notes. Killerbody Industrial Limited gives its address in Chenghai, Shantou, China, with a +86 phone (store.killerbody.com/pages/contact-us); its organisation number has the Hong Kong business registration format and its newer barcodes the Hong Kong GS1 prefix 489, so the company may be registered in Hong Kong."
