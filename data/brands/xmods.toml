notes = "RadioShack's line of 1/28 electric RC tuner cars (from 2003: starter kits with a factory-assembled chassis, bodies and hop-ups; then the Evolution and Evolution Street generations, and 1/24 touring and buggy models of the third generation). HPI distributed them outside the US. Many shops sell hop-ups for the Evolution touring and truck chassis. Country US: the brand was RadioShack's. No current site; status dormant: no maker source dates its end."
