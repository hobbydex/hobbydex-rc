notes = "Maker of screwed-together metal (aluminium, stainless steel, powder-coated) functional truck, trailer and construction machine kits with a large spare parts and options range. History (the shop's WEDICO page): founded on 1 June 1893 in Wuppertal as Wesenfeld, Dicke & Co., a non-ferrous metals maker for the printing trade; it turned to truck models from 1975 and split off its model branch in 1996 as WEDICO GmbH & Co. KG. Since January 2018 WEDICO-models is made and sold by thicon e.K. in Essen (Neuheiten 11/2019 leaflet; impressum of thicon-models.com: thicon e.K., Sven Thiel), the trucks as \"WEDICO-models\", the construction machines (CAT 966G II, CAT D9T) as \"WEDICO-construction\". Article numbers are WEDICO's numbers with the -W suffix (563-W, 309-G-W, 20148-W)."
