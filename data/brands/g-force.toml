notes = "Japanese brand of RC car electronics and accessories: brushless drift and on-road motors (AGEHA, SHIRANUI, Classic Gold), ESCs, setup stands and systems, wheels, and the Xtrada and Genova 1/10 buggy kits; it also sells drone parts (out of scope). Country JP: Japanese dealers (Yodobashi) list it as GForce, ジーフォース. Website: www.gforce-hobby.jp, G-Force's own site (株式会社ジーフォース, G Force Inc. in its footer; RedRC and RC Car Action cite it for G-Force's news, and it hosts the maker's manuals and catalogues), in Japanese. Records are from its product pages (item number, JAN code, release day) and rcMart's listings (a Hong Kong dealer)."
