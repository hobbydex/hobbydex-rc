notes = "American micro crawler parts maker shipping from Texas (its about page: \"An American based Rc Crawler Company\"; some parts made in Texas): upgrade and replacement parts for the Axial SCX24, AX24, SCX30 and UTB18 Capra, the Traxxas TRX-4M, the Redcat Ascent-18 and Ascent-32 and FMS FCX24 crawlers. Brushed and brushless motors (NeoBeast, NanoBeast, NanoBAM, SMP and ROP pancake motors), Rockwolf ESCs and combos, servos, X15 and X8 axles, transmissions, links, chassis (Ugly AF, Stingray, Mini Wild), hard bodies (Mofota, Offender), wheels and tyres, weights, tools and scale accessories; the in-house Mesmo line. The store also resells other brands. Part numbers are the store's SKUs (mostly three digits, a colour or option suffix, combos join the numbers of their parts)."
