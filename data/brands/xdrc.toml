notes = "Chinese maker of 1/14 RC hydraulic construction machines, metal: excavators (945, R945), wheeled loaders (WA470, 580, 980L-type buckets), a 6x6 A40G articulated dump truck, with FlySky PL18EV or I6S radios, smoke and sound units, and spare buckets and forks. Part codes are the XDRC- SKU prefix. Country CN is a best guess from the Chinese stock and shipping of the listings; no address was found. No official site was found: xdrc.cn refused the connection, and xdrc.com and xdrc-rc.com were still queued without an answer (checked 2026-10-22). The data comes from a dealer's listing, RC Construction Vehicle Store (rcconstructionvehicle.com, read 2026-10-22), which sells the models under the vendor XDRC, some through US and DE stock listings."
