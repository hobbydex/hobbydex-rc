notes = "Family-run maker of high-end 1:14.5 functional truck models in Waldsee, Rhineland-Palatinate, Germany (impressum: ScaleART OHG; company history: since 2000): MAN TGS/TGX and Mercedes-Benz Actros/Arocs, SK and Rundhauber trucks built to order, Unimog and MB trac, CAT 963 track loaders, trailers, Meiller and Palfinger bodies and cranes, hydraulics, light and bus electronics, the Commander radios, and the ScaleDRIVE/ScaleTRIAL drivetrain parts, many for Tamiya 1/14 trucks. Shop: scaleart-shop.de. Article numbers are 8 digits (61000203, 74000400)."
