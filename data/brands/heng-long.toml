notes = "Chinese maker of radio-controlled battle tanks, mostly 1/16 (also 1/6, 1/8, 1/24 and 1/30), in plastic and full-metal versions with BB or infrared combat (Tiger I 3818, Panther 3819, Pershing 3838, Panzer III 3849, King Tiger 3888, Leopard 2A6 3889, Sherman 3898, T-99A 3899, M1A2 Abrams 3918, T-90 3938, Merkava 3958 among them), and earlier RC cars such as the Raptor 3850-5 nitro buggy (RCScrapyard, circa 2008). Item numbers are the four-digit model numbers. No site of the maker's own was found: web search finds only dealers (Motion RC, Toucan Hobby and Toucan's henglongtanks.com store). Country CN is a best guess: the dealers ship the tanks from China and name no other country. Its boats (the 3800 tugboat) are out of scope."
