notes = "Japanese brand of on-road tyres, wheels and accessories (1/10 touring, FWD, M-chassis; also bodies and tools). EU product-safety details on retailer pages name the manufacturer as Thai Ride Co., Ltd (Bangkok, Thailand) with a rc-ride.co.jp contact address; the brand's own site is rc-ride.co.jp. Item numbers are five digits, some with a suffix (26073-W), and RH-1nn for nylon wheels."
