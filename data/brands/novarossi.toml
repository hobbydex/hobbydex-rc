notes = "Italian nitro engines (Mito, Live Range, Truggy .28, Adam Drake Special Edition). Named Nova Rossi snc until December 2006, then Novarossi World s.r.l. (Wikipedia). Its site novarossi.it no longer resolves (2026-11-10); novarossi.us is Novarossi Marine USA, a boat engine shop. Italy from the site and the brand history; discontinued lines are marked as the site says. Website: the last official site, www.novarossi.it; the Internet Archive holds its pages from 1998-06-11 to 2020-01-30 (CDX read 2026-11-01); the host no longer resolves. The site links the archived copy of its home page (2015-02-20 capture)."
