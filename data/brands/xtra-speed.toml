notes = "RC parts of the Xtra Speed brand (aluminium, carbon and steel upgrades for Tamiya and other 1/10 kits). No maker page is reachable, so the data comes from the dealer listings tamico.de and modelsport.co.uk. Owner and country from the manufacturer line of those listings: rcMart, Kwun Tong, Kowloon. Website: www.rcmart.com, the shop of its owner rcMart (Xtra Speed is rcMart's house brand); it answers our identified crawler with a Cloudflare bot challenge (HTTP 403), so its pages are not read. rcxtraspeed.com is a fake shop and not the brand's site (owner, 2026-11-19)."
