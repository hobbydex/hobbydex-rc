notes = "Racing tyres and wheels for 1/10 touring, mini, F1, FWD and GT, 1/8 GT, 1/8 buggy and truggy, 1/10 buggy, drag, rock crawler and monster truck (SRC Hobbies range); also bodies, wings and tyre accessories. The company is SR Industrial (SR IND.), \"a specialized radio controlled car tire manufacturer located in South Korea\" (Our Story page); the site's organisation data gives an address in Bucheon-si, Gyeonggi-do. Item numbers lead the product names (D-32R3PGM, GT2-D36WP); the buggy ranges sold with compound and wheel options have none on the site."
