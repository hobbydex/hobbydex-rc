notes = "Chinese maker of 1/14 RC tractor-truck chassis and trucks, metal: 770S, R620, R730, T815, FH750 and 3363-type chassis (4x4 to 10x10), with 3-speed transmissions and differential locks, hydraulic dump semi-trailers, a fuel-tank semi-trailer, cab roofs, exhaust pipes and road barriers, sold ready to run with ST8 radios and as spare parts. Part codes are the ScaleC- SKU prefix. Country CN is a best guess from the Chinese stock and shipping of the listings; no address was found. Website given by the owner, 2026-11-16: www.scaleclub.club, the maker's own shop (SCALECLUB). scaleclub.com is an unrelated US company of that name (an insurance lead generator), not the maker; the guessed domains scaleclub.com.cn and scaleclub.cn do not resolve. The data comes from a dealer's listing, RC Construction Vehicle Store (rcconstructionvehicle.com, read 2026-10-22), which sells the models under the vendor ScaleC."
