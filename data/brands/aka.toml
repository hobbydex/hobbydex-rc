notes = "Racing tyres for 1/8 buggy and truggy and for 1/10 off-road, short course and dirt oval; EVO wheels and wings. raceaka.com redirects to AKA's brand page at Horizon Hobby. Part numbers AKAnnnnnXX: the two letters after the digits are the compound (AKA's tyre compound guide: CR Clay, VR Super Soft, SR Soft, QR Super Soft Long Wear, XR Soft Long Wear, KR Medium Soft, ZR Medium Long Wear, GR Soft Carpet, HR Medium Carpet), a trailing W or Y means on white or yellow EVO wheels, WB the 8-tyre racer bundle with white wheels."
