notes = "Carisma RC: 1/24 GT24 micro cars, 1/10 M40S and 1/8 M48S rally and touring cars, SCA-1E and MSA-1E scale crawlers (Carisma Scale Adventure); Carisma Racing is its race line (4XS, CRF1, Bug-E). Older lines: GT14, GT14B, GTB, GT16, GT10RS, GT10DT, M10, M14 and F14 EVO, M40B and M40DT. Vehicles have 5-digit item numbers ending in 68 (91668), parts 5-digit part numbers (16466)."
