notes = "Chinese maker of metal RC scale trucks and hydraulic construction machines (also written JDM, JD Model, JDMODEL), mostly 1/14: tractor trucks, hydraulic dump trucks, excavators (R920, EC360), loaders (ZW370, 963D), bulldozers (DXR2, 575) and a telescopic forklift, plus trailers, hydraulic components, drivetrain, wheels, tyres, light and sound systems. No working site of the maker's own was found (jdmodels.com and jdmrc.com parked, jd-model.com and eaglemach.com not answering, 2026-10-12): the data comes from a retailer's listing, Toucan Hobby (toucanhobby.com, read 2026-10-12), which sells them under the vendor JDModel with JDModel's JDM-<n> codes. Country CN as a best guess: the products ship from Toucan's Chinese warehouse, and Hangzhou Eagle Machinery (eaglemach.net) calls JDModel its own. Part numbers are JDModel's codes as Toucan's SKUs carry them (JDM-24-ReliefValve-CX -> JDM-24). The 298A/298B go-karts are left out as toy-grade. Toucan Hobby also lists, under JDModel's machine codes only and so not as parts: the JDM-208 cooling fan, the JDM-98 track pair and track pin, and the JDM-118F and F-150 light systems."
