notes = "Bearings since 2003, now also tyres, wheels, springs, slippers and hardware for RC racing. Its Flex Kit pages give a bearing kit per vehicle, each size with its count and a choice of Revolution (rubber seal one side, metal shield the other), rubber or metal sealed, steel or ceramic. Part numbers are its kit SKUs (AV-LOSI-8IGHT). Based in Denver, Colorado (its site footer)."
