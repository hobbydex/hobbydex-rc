notes = "Chinese maker of 1/16 RC tanks and armoured vehicles with infrared or BB combat, smoke and sound (M60A1 ERA, M60A3, M60W, M1A2 Abrams SEP V2 and TUSK II, Leopard 2A7, Leclerc, Centurion Mk5, Churchill Mk.VII, Matilda, M24 Chaffee, M109A2, M2 Bradley, M113, AAV-7A1), in plastic (Upgrade) and metal (Professional) editions. Item numbers are the model codes the listings print (M2022-1, H2408 ...). No site of the maker's own was found (2026-11-18: web search finds only dealers: Motion RC, Toucan Hobby, RC Construction Vehicle Store). Country CN is a best guess: the dealers ship from China and name no other country."
