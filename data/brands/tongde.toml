notes = "Chinese maker of 1/16 RC tanks and armoured vehicles with infrared or BB combat, smoke and sound (M60A1 ERA, M60A3, M60W, M1A2 Abrams SEP V2 and TUSK II, Leopard 2A7, Leclerc, Centurion Mk5, Churchill Mk.VII, Matilda, M24 Chaffee, M109A2, M2 Bradley, M113, AAV-7A1), in plastic (Upgrade) and metal (Professional) editions. Item numbers are the model codes the listings print (M2022-1, H2408 ...). Website: www.stplane.com, the site of Shantou Tongde Craft Products Co., Ltd. (Jinming Industrial Area, Shantou, Guangdong; founded 2004), which lists its radio-controlled battle tanks in plastic, metal upgrade and all-metal versions beside static aircraft models; corroborated by its Made-in-China storefront (stplane-tongde) and a Hobby Squawk thread naming the maker; read 2026-11-20. Dealers: Motion RC, Toucan Hobby, RC Construction Vehicle Store. Country CN from the maker's address."
