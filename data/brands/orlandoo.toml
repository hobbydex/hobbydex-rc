notes = "1/32 and 1/35 micro scale RC kits (OH32A, OH32X, OH32M, OH32T, OH32P, OH32V, OH32N trailers, OH35) sold unassembled and unpainted, and their parts, bodies, lights, tyres, motors and electronics. Website: www.oh-model.com, identified as Orlandoo's own site by the owner on 2026-11-20 from its logo (title 奥兰多汉特, Orlandoo Hunter; served over http only, https loops in redirects); on 2026-11-20 it shows only a splash page saying the site is being upgraded, with no product data. The look-alike shops orlandoohunters.com, orlandoohunterus.com and orlandoohunter.net (a Banggood affiliate) are not the maker. Records are from dealer listings: AMain Hobbies (its MPN is OLH + Orlandoo's number), Tiny4x4 (UK) and rcMart (Hong Kong). Country CN from the site's Chinese ICP registration (Zhejiang, 浙ICP备18002042号) printed on its home page."
