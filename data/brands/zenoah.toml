notes = "Zenoah engines (2-stroke petrol, RC and scooter types) and spare parts, a brand of Husqvarna Zenoah Co., Ltd. (Saitama, Japan; a Husqvarna Group company since 2007). Website given by the owner, 2026-11-16: www.zenoah.com/jp/ (the old zenoah.co.jp no longer answers). The maker's site sells garden and forestry machines; its document search lists the hobby engines (G230RC to G320RC, the PU, PUM and PUH types) with their product numbers and owner's manuals (www.zenoah.com/jp/document-search/hobby-engines/). Its news \"notice of transfer of hobby engine business\" says the hobby engine business went to 株式会社協同 (Kyodo, Shinjuku, Tokyo) with a licence for the Zenoah brand, planned to make the engines and supply the spare parts from January 2025. The RC engines and their spares are read from the US dealer gomeyer.com (doc/zenoah/gomeyer-shop-listing); Zenoah's official Italian distributor (Roberto Ferraro, www.zenoah.it and www.zenoah.eu) is a further dealer source."
