notes = "Chinese maker of 1/76 micro RC cars (C64 drift, C71-C76 sports cars, the Mini Cooper, monster trucks) and their P31, P52 and P62 radios and upgrade parts, sold through Motion RC, AsiaTees and others; item numbers are the C-numbers the dealers print (Motion RC's TBRC codes). Website: www.turboracing.net, the maker's site (GuangDong NewStone Technology Co., Ltd.: the 1:76 on-road, off-road, licence, drift and semi-truck cars, radios, tracks and a manual download), corroborated by the Turbo Racing manual that names Shenzhen NewStone Technology as the maker and by NewStone's Made-in-China listing of the Turbo Racing 1:76 cars; read 2026-11-20. Country CN from the maker's name and address (Guangdong)."
