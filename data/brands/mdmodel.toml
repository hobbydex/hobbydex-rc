notes = "Chinese maker (also written MD MODEL) of 1/14 RC construction and truck models, metal and hydraulic: tipper and dump trucks (4x4, 6x6, 8x8, 8x4), wrecker trucks, a D7 bulldozer, an LR926 tracked excavator, a U423 4x4 crawler and 770S tractor trucks, with ST8 or FlySky radios, plus plastic cabs, snow blades and chassis parts. Part codes are the MD- SKU prefix. Country CN is a best guess from the Chinese stock and shipping of the listings; no address was found. No official site was found: mdmodel.com is a parked domain (a for-sale page, checked 2026-10-22), mdmodel.cn answered 403 (refused, not retried), and mdmodelrc.com was still queued without an answer (checked 2026-10-22). The data comes from a dealer's listing, RC Construction Vehicle Store (rcconstructionvehicle.com, read 2026-10-22), which sells the models under the vendor MDMODEL; Toucan Hobby (toucanhobby.com) lists the same models (U423, D7, 3348, 3363, 770S, with MD- SKUs) under the vendor MODO. Rechecked 2026-11-16: still no maker site; mdmodel.com is a for-sale page (2026-11-11), mdmodel.cn refuses (403), mdmodelrc.com failed in the crawl queue, and web search finds only dealers."
