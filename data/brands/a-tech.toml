notes = "Korean maker of small electric RC cars (Gimpo, Gyeonggi-do), from its own EC21 storefront (georgiej.en.ec21.com, read 2026-11-17): the XMB4 1:18 mini buggy and XMT4 1:18 mini monster truck RTRs, the BX-1 racing buggy, the ATX 1:10 EP touring car and the LEO-X 1:20 EP buggy. No website of its own is confirmed; GPM Racing's hop-ups for the XMB4 and XMT4 are sold by AsiaTees under the brand A-Tech. Status dormant (best guess): the EC21 storefront is undated (free member since 2006-06-09, no transactions, the same five products), the archive holds no page of it, and no other source shows A-Tech trading now; no closure statement found."
