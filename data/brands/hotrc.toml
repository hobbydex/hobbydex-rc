notes = "Chinese maker of low-cost 2.4 GHz radio systems for RC cars, tanks and construction models (DS-600, CT-6B, HT-6A, HT-8A transmitters and their receivers), LiPo chargers (B3) and battery checkers. Country CN is a best guess: the dealers ship from China, and manual directories name the maker Hobby Model Technology Co., Ltd. without an address. No site of the maker's own corroborated yet (2026-11-18)."
