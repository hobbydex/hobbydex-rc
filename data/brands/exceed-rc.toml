notes = "Exceed RC, the car brand (RC Scrapyard exceed-rc.htm, which lists no models). Not EXceed (SU LLC, Japan), which is brand/exceed-jp. Country: the brand is the in-house line of the US retailer NitroRCX (nitrorcx.com channel page, via web search); its store is the website below (no separate maker site found). Status active: still sold by retailers; no closure found. Website: www.nitrorcx.com, the NitroRCX store that sold the Exceed RC line, is defunct: the archive's last full capture of its home page is of 2025-03-01, and from 2025-04-04 on (and still on 2026-11-16) the domain shows a parked lander."
