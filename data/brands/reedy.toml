notes = "Owned by Associated Electrics (Team Associated), whose motors, ESCs, batteries, chargers and servos it sells as Reedy Power; reedypower.com redirects to the Reedy pages of associatedelectrics.com. Brushless motors (Sonic 540-M4, 540-FT, 900 and 1525 micro), brushed motors (Radon 2), Blackbox ESCs, Zappers and StockStar competition packs, WolfPack packs and chargers. Part numbers share Associated's number space (27510 motors, 27043 ESCs, 27615 packs, 27203 chargers)."
