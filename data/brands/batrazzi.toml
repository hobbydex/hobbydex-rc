notes = "Upgrade parts for 1/10 and 1/18 to 1/24 scale RC cars: aluminium and brass steering, chassis links, wheels, tires, all-terrain tracks, shocks and bumpers, sold by its own Shopline store (www.batrazzi.com, store support support@batrazzi.com). The store groups its range by vehicle (FMS FCX18, FCX24, FCX10 and FCX24M, Axial SCX24 and SCX30, Traxxas TRX-4M) and by part. Its footer links its Facebook and YouTube channels (@Batrazzi). The store names no legal entity and no country, and no page says who owns the brand; FMS sells Batrazzi parts too (fmshobby.com/collections/batrazzi), which does not make FMS its owner."
