notes = "FG Modellsport: radio control racing cars, manufacturer and distributor (the maker's home page). Website over http on purpose (checked 2026-11-18): the FG site is served only over plain http; over https the shared server answers with T2M's site (t2m.fr) and T2M's certificate (Techniques Modernes du Modelisme, t2m.fr / www.t2m.fr only), because fg-modellsport.com has no certificate of its own there. Both domains resolve to the same server, and the FG pages load their news and product files from t2m.fr. Browsers that force https still land on T2M's site. Country from the French telephone number on the maker's site (+33 3 87); the site's company page describes T2M, a French company. RC Scrapyard lists its models (fg.htm)."
