notes = "Chinese maker of 1/14 metal hydraulic RC construction machines (also written CUT, CUT Model, CUTModel): the LR914 (C914, 914) tracked excavator and its 4x4 wheeled version with 5- to 11-way valves (PRO MAX), the C121 scissor lift, the C1200 crawler crane, hydraulic trailers, and hydraulic components (valves, pumps, relief valves, tanks, rotary motors) and attachments. No site of the maker's own was found: the data comes from a retailer's listing, Toucan Hobby (toucanhobby.com, read 2026-10-12), which names CUT as manufacturer. Country CN: the products ship from Toucan's Shenzhen warehouse and the part codes are Chinese pinyin abbreviations. Part numbers are CUT's codes as Toucan's SKUs carry them (CUT-C914-04-... -> C914-04, CUT-BZ-20-3L-Valve -> BZ-20-3L). Variants Toucan Hobby lists without a CUT code (not imported): the LR914 PRO MAX hydraulic wrist, the C914 three-tooth bucket, the 11.1V 4500mAh LiPo for C914/LR926/R920, the 914/918/920 UV decals, the LR914 PRO 2-in-1 ESC, the C914 brass oil tubes, the cabin front guard net, the 60A one-way brushless ESC, the 1-to-2 flow divider and the EC160E hydraulic system."
