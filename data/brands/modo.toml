notes = "1/14 metal hydraulic dump trucks, tractor trucks, wreckers, trailers, a D7 bulldozer and an LR926 excavator, and 1/10 U423 rock crawlers and the MD009 tractor; also listed as MDModel or BVTMODO. bvtmodo.com is the closest to an official site found: a shop of Baivolt Limited, Mong Kok, Hong Kong, that lists itself as BVT and sells MDModel and BVT products; its official status is unconfirmed. Records are from Toucan Hobby's listings (a dealer). Model numbers 770S, 3348 and 3363 are also used by LXY; LXY and MODO 770S tractor trucks of one layout are recorded as one platform (likely)."
