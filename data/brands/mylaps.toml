notes = "Sports timing from Haarlem (headquarters Zuiderhoutlaan 4, MYLAPS BV), founded in 1982 as AMB i.t. by two RC racers who built the first transponder timing system for their RC track; the RC line was sold as AMBrc before. Listed here: the personal RC transponders (RC4, RC4 Pro, RC4 Hybrid) and their holders, which racers buy in the maker's shop. The RC4 timing system itself (RC4 Decoder, detection loops) is sold to clubs and tracks and is not listed. The shop prints no item numbers; dealers sell the transponders as 10R120 (RC4), 10R147 (RC4 Pro) and 10R078 (RC4 Hybrid), the holder as 40R222."
