notes = "Chinese maker of small ready-to-run RC cars: 1/43 and 1/36 4WD drift cars with gyro (4301-4311, 3611-3615), 1/36 crawlers (3601-3604), 1/24 off-road cars (2401A, 2401AH, 2401B) and a 1/10 brushless rally car (1004). Item numbers are the model numbers the listings print. No site of the maker's own was found (2026-11-18: web search finds only dealers: Toucan Hobby, Banggood, rcbuying). Country CN is a best guess: the dealers ship the cars from China and name no other country."
