notes = "Competition RC car electronics: HD, Comet and Falcon 8 brushless ESCs and their spare boards and cases, N22 Modified and Stock Spec, N44 and N45 brushless motors, competition and hobby LiPo and NiMH packs, transmitter and receiver packs, chargers, fans and wiring. Founded in Worcester, UK, in 1984 by Nick Marson (History page); today \"a brand of Lautenbach Racing Products GmbH\" (LRP, Schorndorf, Germany), whose catalogue on lrp.cc sells it. Article numbers are LRP's, 5 or 6 digits with plug suffixes (999302XT60)."
