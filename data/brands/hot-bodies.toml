notes = "Renamed HB Racing in June 2016 when Neidhart SA bought it from HPI (BigSquidRC and RedRC, 2016); the data of both names is in brand/hb-racing. ended is the rename date; no country, since the owner changed. Website: the last official site, www.hotbodiesonline.com, which served its kit pages and manuals; the Internet Archive holds its maker pages from 2000-08-18 to 2013 (CDX read 2026-11); the domain now carries unrelated blog posts (its sitemap, read 2026-11-11), so the archive copies are the source."
