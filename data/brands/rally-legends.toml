notes = "The Rally Legends: 1/10 RTR replicas of historic rally cars (Lancia, Fiat, Ford, Audi, Subaru) on one 4WD shaft-driven chassis, the RL004, with its spare and option parts, bodies, rims and tyres. Italtrading's own brand, developed in Italy; sold through the Italtrading store (therallylegends.eu leads there). Product codes EZRL followed by digits (EZRL2405 the RL004 chassis). Italtrading's Queens of the Road cars (EZQR...) use the same chassis and are not imported here."
