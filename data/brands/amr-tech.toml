notes = "Taiwanese maker of small nitro cars and engines (the site calls itself AMR): the SCUD 09R 1/12 4WD gas touring car (2008), the 1/10 MINI GP series (MINI-Pickup, CHEV-Pickup, N5-Hatchback GP), its 09CZ engine and the Gears 10 1/12 nitro buggy (2010). Its site amrtech.com.tw is named as the source of AMR Tech news by Red RC; the archive holds captures from 2009 to 2012, read 2026-11-17, and the live site was not checked."
