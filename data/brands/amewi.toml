notes = "Amewi Trade GmbH, Borchen (Paderborn), founded 2004 by Alexander Widerspan (the site's Impressum and 'Ueber uns'): importer and wholesaler selling RC cars, trucks, construction machines, tanks, boats, aircraft and accessories under its own 5-digit article numbers (22414) and labels (AMXRacing, AMXRock, Pitbull X, ALLRock, Amewi Construction). Only the own-brand vehicles are in Hobbydex; the third-party makers it distributes under Amewi numbers (MJX Hyper Go, Haiboxing, Heng Long tanks) are not. Spare parts carry a group prefix and the maker's number (004-050005E) or a plain Amewi number (28915). Names are from the English amewi.com; name_de keeps the German name."
