notes = "Hot Bodies, renamed HB Racing in 2016 when Neidhart SA (Switzerland, Team Orion) bought it from HPI; 1/8 buggies and truggies (D8/E8 World Spec, D819/E819, D817/E817) and 1/10 buggies (D2, D4, D216, D413, D418). 1080RC (France) announced it had acquired the brand on 2026-03-31; hbracing.com has been parked since. Part numbers carry an HB prefix (HB204867, HBB028, HBC8101-1). Not related to HoBao, which uses HB- in some of its own model names."
