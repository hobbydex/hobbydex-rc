notes = "Chinese maker of 1/14 RC tractor trucks on metal chassis, numbered 01, 02, 05 and 06 on their listings: 3363-type 10x10, 770S 4x4 and 6x6 and FH16 10x10 chassis, RTR with ST8 radios, 2-speed or 3-speed gearboxes, differential locks, smoke and light systems. Part codes are the Unitru-<number> SKU prefix. Country CN is a best guess from the Chinese stock and shipping of the listings; no address was found. No official site was found: unitru.com is a parked domain (it redirects to a lander page, checked 2026-10-22), unitru.cn and unitrurc.com were still queued without an answer (checked 2026-10-22). The data comes from a dealer's listing, RC Construction Vehicle Store (rcconstructionvehicle.com, read 2026-10-22), which sells the models under the vendor Unitru."
