notes = "1/14 scale RC trucks and their parts: metal hydraulic dump, hook-lift and roll-off crane trucks, tractor chassis, trailers and dollies (Mercedes-Benz, Scania, MAN, Volvo and IVECO styled), with cab parts, lights, rims, tyres, hydraulics and gearboxes, many made to fit Tamiya 1/14 trucks. lxyrc.eu is run by Lxyrc BV (Vermeulen beheer BV), Ansen, the Netherlands (its terms and conditions); the trucks themselves are Chinese-built. Toucan Hobby sells LXY trucks and trailers under model numbers that MODO (MDModel) also uses (770S, G88, 3363, 3348, 4151AK), so several LXY and MODO models look like one platform sold under two names."
