notes = "Xtreme Aerodynamics: Lexan bodies for 1/10 on-road cars and 1/8 buggies. The same company as Matrix: Xtreme S.r.l., Busto Garolfo, Italy, which runs matrixtires.net (brand/matrix, legal name Xtreme S.r.l.); the bodies use the same MX- item codes as Matrix Tires. A sister brand of Matrix, not a duplicate. Website: xtremeaerodynamics.it, named as the manufacturer's site (Xtreme S.r.l., Busto Garolfo) in RUDDOG's GPSR line; its home page (Xtreme Aerodynamics B2B catalogue of bodies) read through the crawl queue on 2026-11-17."
