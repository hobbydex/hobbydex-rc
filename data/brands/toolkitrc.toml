notes = "Founded in 2018 in Shenzhen (Bao'an District), per its About Us and Contact pages. Compact smart chargers for RC batteries: DC chargers (M4 Pocket, M6D, M8D, M8P, M9, M7, H1), AC/DC chargers (M4AC, M450, M6AC, M7AC, M8AC, M6DAC, Q4AC, Q6AC, M8DAC, M14DAC), simple AC and USB-C chargers (C3, C4, C6, CN3, U3, UN3), power supplies (P200 V2, ADP series), the MC8 battery checker and servo tester, ST8 servo tester and WM150 watt meter. Models are sold under their names; the shop's SKUs look like TK12900."
