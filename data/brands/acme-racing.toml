notes = "RC car brand of Acme Tech. (Shenzhen) Co., Ltd. (Henggang, Longgang, Shenzhen, from its site's footer). Website: www.acme-rc.com, named as the Acme Racing website by RC Scrapyard's model pages and an RCTech forum post; on 2026-11-20 it still lists the 1/8, 1/10 and 1/16 electric and nitro range, with news up to the Beijing 2016 model expo. 3Racing's own shop lists its option parts under \"FOR ACME Racing NB16\" (hk.3racing.hk, car_parts.php?carkits_key=15), RC Scrapyard lists its range of buggies, monster trucks, on-road cars and truggies in 1/8, 1/10 and 1/16 (NB16 as A3007T), and AsiaTees files GPM Racing's NB16 hop-ups under Piktor Miwi NB16. Status dormant (best guess): its site's newest news item is of 2016 (copyright 2015) and no closure statement found."
