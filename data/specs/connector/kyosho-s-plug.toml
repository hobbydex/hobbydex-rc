id = "spec/connector/kyosho-s-plug"
category = "connector"
name = "Kyosho S-plug"
family = "Kyosho"
pins = 2
anti_spark = false
polarized = true
notes = "Kyosho's 2-pin plug. Its ESC and wire pages name it \"S-plug\" (ORION WP brush ESC 45A ORI65130 S-Plug, https://rc.kyosho.com/en/82243sb.html; 2-Way Connector (S-plug) 82247-01, https://rc.kyosho.com/en/82247-01.html), and its battery pages name the 2P Super Plug A and B types (R246-8522, https://rc.kyosho.com/en/r246-8522.html; R246-8523, https://rc.kyosho.com/en/r246-8523.html), which the spec takes as the same plug family. Kyosho's ESC page for 34405t2 says its ESC \"features Super Plug (Deans) specifications\", so the plug is kept apart from deans. No rating or contact size is stated."
