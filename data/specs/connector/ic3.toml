id = "spec/connector/ic3"
category = "connector"
name = "IC3 (EC-compatible)"
family = "IC"
pins = 2
anti_spark = false
polarized = true
notes = "pins counts the two power contacts; an IC3 plug also carries a small Smart data contact beside them, which Spektrum's adapters wire through (\"an internal Smart connection wire on IC connectors\", https://www.horizonhobby.com/product/spektrum-one-piece-battery-adapter-ic3-device-ic2-battery-2/SPMXCA520.html). Spektrum states that IC3 and IC5 connectors are backwards compatible with EC3 and EC5 connectors (https://www.horizonhobby.com/product/spektrum-s2200-g2-ac-2x200w-smart-battery-charger/SPMXC2010.html); an EC plug has no data contact, so the two mate for power only."
