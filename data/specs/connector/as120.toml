notes = "Amass's title calls it an anti-spark 2+4 connector: 2 power and 4 signal contacts. It rates the power contacts at 60 A MAX with 8 AWG wire for a temperature rise under 85 C; the signal contacts are rated 1 A (Amass's product page). Shops often quote higher figures, which Amass does not state."
