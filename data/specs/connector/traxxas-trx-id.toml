id = "spec/connector/traxxas-trx-id"
category = "connector"
name = "Traxxas iD (TRX ID)"
family = "Traxxas"
anti_spark = false
polarized = true
notes = "Besides its two power terminals, the iD plug of a Traxxas LiPo pack carries the balance wires: small contacts in the corners of the housing, which Traxxas calls the \"Balance Wire Connection\" (callout photo on https://traxxas.com/2872x-5000-mah-111-volt-3-cell-lipo-battery). NiMH iD packs have none (callout photo on https://traxxas.com/2950x-4200-mah-84-volt-7-cell-nimh-battery). Traxxas says the plug also lets an iD charger and battery communicate (https://traxxas.com/93064-4-110-4-tec-30-awd-toyota-supra-gt4-race-car-w-tq-radio)."
