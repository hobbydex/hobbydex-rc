notes = "pins counts the two power contacts. Spektrum's Firma ESC pages: \"High heat-resistant IC2 connectors, backwards compatible with EC2 connectors\" (https://www.horizonhobby.com/product/spektrum-firma-brushless-motor-esc-2-in-1-combo-5200kv/SPMXSEM0500.html), and \"If using with batteries featuring an IC2 connector the adapter SPMXCA321 is required\" (https://www.horizonhobby.com/product/spektrum-firma-brushless-motor-esc-2-in-1-combo-6000kv/SPMXSEM0501.html). No rating or contact size is stated by the maker."
