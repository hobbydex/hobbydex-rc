id = "standard/din-6799"
code = "DIN 6799"
title = "E-clips (E-type retaining rings for shafts)"
url = "https://fasten.it/en/Norms/Norm/DIN%206799"
notes = "Current edition 06/2017, superseding 04/2011 and 09/1981. Each size is named by its nominal groove diameter (groove_mm); the shaft range is the 04/2011 block of the same page, the outer diameter and thickness are the same in both editions. The page writes the shaft ranges with strict inequalities (2.5 < d1 < 5); the ends are read as fitting. Sizes 10 and 12 to 30 have no spec in data/specs/eclip yet (no shaft of 11 mm or more is there)."

