]
terms = [
  { term = "Brushed motor (cored)", text = "A motor whose rotor is wound around an iron core and turns against carbon brushes that carry current to the windings. Simple and inexpensive; the brushes wear over time." },
  { term = "Coreless motor", text = "A brushed motor whose rotor winding has no iron core, so the rotor is lighter and speeds up and slows down more quickly than a cored one. It still has brushes." },
  { term = "Brushless motor", text = "A motor with no brushes: magnets on the rotor, and an electronic circuit in the servo switches the coils. With no brushes to wear, it has less to maintain." },
  { term = "Digital", text = "A servo with a microprocessor that reads the signal and drives the motor at a faster, finer update rate than an analog servo, whose circuit is simpler." },
  { term = "Analog", text = "A servo with a simpler circuit and a slower update rate than a digital servo. Compare the stated figures rather than the type alone." },
  { term = "HV (high voltage)", text = "A servo built to run on 7.4 V to 8.4 V, such as a 2-cell LiPo or LiHV pack. Check the stated voltage range before running it on a lower voltage." },
  { term = "Case size", text = "Size classes are named by each maker and are not standard across brands: compare the case dimensions and the mounting holes, not only the name." },
  { term = "Standard", text = "The full-size case, the most common in 1/10 and 1/8 scale cars." },
  { term = "Low-profile", text = "A standard-width case that is shorter in height, for chassis with little room above the servo." },
  { term = "Mini", text = "A case smaller than standard, for smaller cars and models." },
  { term = "Micro", text = "The smallest case class, for small models and aircraft." },
  { term = "Metal gears", text = "Gears of steel, titanium or aluminium alloy. Stronger than plastic under shock loads, and heavier. The maker may say only 'metal'." },
  { term = "Plastic gears", text = "Gears of nylon or a composite. Lighter than metal, but more likely to strip under shock loads." },
  { term = "Aluminium case", text = "A case of aluminium conducts heat away from the motor better than plastic, and is heavier. A plastic case is lighter and cheaper." },
  { term = "Waterproof", text = "The maker's claim that water will not reach the case, cable or circuit. An IP code gives the test level: the first digit is for dust, the second for water. IP67 is dust-tight and protected against temporary immersion. A waterproof claim with no code gives no test level." },
  { term = "Spline", text = "The toothed output shaft that the servo horn fits onto. The count (23T, 24T, 25T) is the number of teeth; a horn fits only a servo with the same spline." },
  { term = "Torque", text = "The turning force at the output shaft, in kg-cm: 10 kg-cm holds 10 kg at 1 cm from the centre of the shaft." },
  { term = "Speed", text = "The time the servo takes to turn 60 degrees with no load, in seconds. A smaller figure is faster." },
  { term = "Torque and speed per voltage", text = "Both rise with the supply voltage, because the motor gets more power. Makers state them at each voltage, so compare servos at the same voltage and check the voltage you will run." },
  { term = "Programmable", text = "A programmable servo keeps settings such as direction, end points or speed in its own memory, changed with a programming box or a setup menu. The maker's manual lists what can be set." },
]
