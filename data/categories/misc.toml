id = "category/misc"
name = "Miscellaneous"
summary = "Named parts that fit no other category"
description = "Parts we can name that fit no other category: springs other than shock springs (clutch, brake, servo-saver and throttle-return springs), landing-gear retracts, tape, hook-and-loop and velcro, silicone tubing and wire sleeves, and adjusters, supports, adapters and blocks whose purpose the name states. A bare or unreadable name (\"Rear Lower\", \"Rod A\", a number) is not misc: it stays uncategorised until a maker source says what the part is."
any_car = true
