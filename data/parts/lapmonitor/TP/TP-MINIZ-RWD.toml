notes = "Mini RC cars transponders (MiniZ and others small scale RC cars). Please select your transponder connector: - Cable with 4 pin ICS connector for MR03 ASF/EVO/VE/MHS - Cable with O-ring terminal for MR03 RWD, MR03 Sports / Sport 2 - Cable with 3 pin JST-SH for GLA/GLR mini receiver - Cable with 3 pin JST-XH for LOSI Micro-B. Mini RC transponder does not support ID change. There are 96 differents values (from 1 to 96)."
