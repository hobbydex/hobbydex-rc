notes = "Self-driving add-on for any R/C car with an ESC and a standard PWM steering servo: the car follows a wire loop buried in the ground or laid on the surface, in automatic or semi-manual cruise-control mode. The store lists the set without contents; the page says the basic set makes the car follow the wire, and names the Transmitter Board, Receiver Board and sensor coil as the system's parts. The receiver runs open-source ESP32 firmware, at https://github.com/rctestflight/Trail-Tracer (MPL-2.0)."
