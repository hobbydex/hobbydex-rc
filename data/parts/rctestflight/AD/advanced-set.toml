notes = "Self-driving add-on for any R/C car with an ESC and a standard PWM steering servo. The store lists the set without contents, and the page does not say which features each set includes; the features the page lists for the system are wireless telemetry, multi-vehicle collision avoidance, creep throttle, SineSwerve, rear steering with dual sensors, and a stuck detector. The receiver runs open-source ESP32 firmware, at https://github.com/rctestflight/Trail-Tracer (MPL-2.0)."
