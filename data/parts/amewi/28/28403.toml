notes = "Contents: High-quality, professional 100W charger/discharger with 220V and 11-18V (XT60) connection. The charger is suitable for the following battery types: Li-Po, Li-Fe, Li-Ion/Li-HV batteries cells 1-6, NiCd/NiMH batteries cells 1-15, lead batteries 2-20V (1-10 cells). In addition, the charger has a connection for a temperature sensor (optional sensor required), a mini USB-PC link and a 5V / 2.1A USB output. The overall operation of the charger is simple and intuitive. It also provides a very high equalisation current for cells that have a drift of almost 500mA per cell!; Features:; 100W / 10A charging capacity; 12V / 220V capable (11-18V DC via optional XT60 connection cable); USB output; Handy design; Memory for up to 10 battery profiles; Connection for temperature sensor (optional sensor required); Integrated battery tester; Internal resistance measurement in the unit; Technical data:; Length: 135mm; Width: 95mm; Height: 61mm; Input voltage AC: 100-240V; Input voltage DC: 11.0-18.0V; Charging power: max. 100W; Discharge power: max. 10W; Charging current: 0.1-10.0A; Discharge current: 0.1-5.0A; Balance current: max. 500mA/cell; Lithium batteries: Li-Po, Li-Ion, Li-Fe, Li-HV 1-6 cells; Nickel batteries: NiCd/NiMh 1-15 cells; Lead-acid batteries: 2-20V (1-10 cells); Battery memory: 10; Weight: 440g; Memory profiles: 10; Scope of delivery:; Charger AMC100; Mains cable; Charging cable with DENS T-plug; Balance board; Detailed instructions DE/EN"
