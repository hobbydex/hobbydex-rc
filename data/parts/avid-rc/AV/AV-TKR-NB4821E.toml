notes = "Essentials kit: Avid leaves out the bearings that seldom need replacing: (10) 5x8 Rubber - Swaybars, Ackermann Plate , and Throttle Linkage; (4) 6x10 Revolutions - Steering Rack Bearing kit is set to include our new Clutch bearings which are metal shielded at $2/ea and designed to handle the most extreme clutch conditions. It is recommended to always blow out the grease in your clutch bearings with an air compressor.. Each size can be ordered as one of: Revolution, Revolution | Aura, Rubber, Metal, Ceramic Revolution, Ceramic Revolution | Aura, Ceramic Metal, Ceramic Metal | Aura, Rear, Ceramic Rear, Motor Bearing, Ceramic Motor Bearing, Metal | Clutch (Avid's Flex Kit builder)."
