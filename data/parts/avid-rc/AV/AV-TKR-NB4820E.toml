notes = "Essentials kit: Avid leaves out the bearings that seldom need replacing: (4) 5x8 Rubber - Swaybars; (4) 5x8 Revolution - Ackermann Plate; (4) 5x10 Rubber - Caster Blocks; (4) 6x10 Revolutions - Steering Rack Bearing kit is set to include our new Clutch bearings which are metal shielded at $2/ea and designed to handle the most extreme clutch conditions. It is recommended to always blow out the grease in your clutch bearings with an air compressor.. Each size can be ordered as one of: Revolution, Revolution | Aura, Rubber, Metal, Ceramic Revolution, Ceramic Metal, Ceramic Revolution | Aura, Ceramic Metal | Aura, Metal | Clutch, Motor Bearing, Ceramic Motor Bearing (Avid's Flex Kit builder)."
