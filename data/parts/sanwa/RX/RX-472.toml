notes = "Sanwa specifications: frequency 2.4GHz FHSS4/FHSS3; input voltage 4.8～7.4Ｖ; compatible radios M12, EXZES Z, MT-4 ( SSL not support ) SSL Function (Sanwa Synchronaized Link) System From using both of \"RX-472\" and \"Super Vortex Zero\" , Drivers operate \"Code AUX Function\" which is included on M12 & EXZES-Z and can adujust setting of equipment directly and quickly from Radios. In case of using SSL System, Drivers don't need to use Setting Card or PC. And also, Telemetry data can be sent to Radios without using any Sensors. In case of using MT-4 with both of \"RX-472\" and \"Super Vortex Zero\", SSL Function is not responded, but Telemetry data can be sent to Radios without using any Sensors. Notice Dimensions on product specification only shows the size of receiver itself and it excludes length of the antenna and crystal projection. To maintain the reception of device, please do not cut the antenna. For additional information, please read official manual for each product.."
