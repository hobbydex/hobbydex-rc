title = "Absima CR4.4eco HILUX is a rebranded Yikong YK41015"
date = "2026-11-01"
reported_by = "francisdb"
statement = "Absima rebrands Yikong cars: the Absima CR4.4eco HILUX (item 12050) is the Yikong YK41015."
basis = "Owner knowledge, checked against absima.shop item 12050 and yikongrccar.com YK41015 (neither names the other brand). Both state: 1/10 4WD crawler, wheelbase 325 mm, 550 brushed motor, Hobbywing WP-1060 60A ESC, remote-switched 2-speed gearbox, manually lockable front and rear differentials, portal axles, 25 kg metal-gear steering servo, 2-3S LiPo, ground clearance 60-65 mm, weight 2.52-2.545 kg. Lengths differ (Absima 535 mm, Yikong 488 mm). No spare part numbers match (Absima 1231xxx, Yikong 21xxx), so parts are not recorded as interchangeable."
