id = "doc/community/2026-11-01-absima-cr4-4eco-is-yikong-yk41015"
kind = "owner_report"
title = "Absima CR4.4eco (Hilux, Bronco) is likely a rebranded Yikong YK41011 / YK41015"
date = "2026-11-01"
reported_by = "francisdb"
statement = "Absima rebrands Yikong cars: the Absima CR4.4eco HILUX (12050, 12051) is likely the Yikong YK41011 (LC79 Cruiser) and the CR4.4eco BRONCO (12052, 12053) is likely the Yikong YK41015. Recorded as a likely rebrand: neither maker names the other, the match rests on specs and body."
basis = "Owner knowledge, checked against absima.shop items 12050-12053 and yikongrccar.com YK41015 (neither names the other brand). Both Absima and YK41015 state: 1/10 4WD crawler, wheelbase 325 mm, 550 brushed motor, Hobbywing WP-1060 60A ESC, remote-switched 2-speed gearbox, manually lockable front and rear differentials, portal axles, 25 kg metal-gear steering servo, 2-3S LiPo, ground clearance 60-65 mm, weight 2.52-2.545 kg. YK41015: length 488 mm (dealer page), described by distributor Robitronic as a tribute to the US trucks of the 70s and 80s, which fits the Bronco body (Absima Bronco 510 mm, so the length does not match). YK41011: the LC79 Cruiser, a Toyota pickup (Frontline Hobbies listing, https://www.frontlinehobbies.com.au/yikong-1-10-lc79-cruiser-brushed-artr-grey-yk41011), 535 mm long like the Absima Hilux, but with a 15 kg servo where the Hilux has 25 kg. No Yikong model is called Hilux; YK41012 is a boxy American-style truck. No spare part numbers match (Absima 1231xxx, Yikong 21xxx), so parts are not recorded as interchangeable. Distributor pages: https://shop.robitronic.com/en/yikong-41015-crawler-1-10-rtr-yk41015a"
