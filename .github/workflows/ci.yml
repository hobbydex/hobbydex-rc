name: Validate data

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # check_ids compares with the base revision
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Only known file types may be tracked
        run: |
          bad=$(git ls-files | grep -vE '^(data/.+\.toml|art/(kits|releases|parts)/[^/]+/[^/]+\.svg|data/LICENSE|docs/[^/]+\.md|tools/[^/]+\.py|\.github/workflows/[^/]+\.yml|\.github/dependabot\.yml|README\.md|CONTRIBUTING\.md|LICENSE|\.gitignore)$' || true)
          if [ -n "$bad" ]; then
            echo "files of a type this repository does not accept:" >&2
            echo "$bad" >&2
            exit 1
          fi
      - name: Validate every TOML file under data/
        run: python3 -I tools/validate.py
      - name: Tests of the audit checks and the retired kit list
        run: |
          for t in test_audit_manual_kind test_audit_archive_files test_audit_twins_diffs test_yeah_models_not_retired test_audit_placeholder_title test_audit_english_twin; do
            echo "== $t"
            python3 -I "tools/$t.py"
          done
      - name: The audit runs on the data within 2 GB
        run: python3 -I tools/test_audit_memory.py
      - name: The audit's Tamiya static-kit rule
        run: python3 -I tools/test_audit_tamiya_static.py
      - name: The audit's Tamiya maker link counts a capture of the maker's gone page
        run: python3 -I tools/test_audit_tamiya_item.py
      - name: The audit leaves aircraft parts out of the car-link queue
        run: python3 -I tools/test_audit_aircraft.py
      - name: The audit skips family kits (no release owed)
        run: python3 -I tools/test_audit_family_kit.py
      - name: The audit's spec-unlinked check counts includes and protocols as use
        run: python3 -I tools/test_audit_spec_unlinked.py
      - name: The audit's service-pack, body-set, name-count and title-language rules
        run: |
          for t in test_audit_service_pack test_audit_body_set test_audit_name_count test_audit_title_language test_audit_gtin_in_cache; do
            echo "== $t"
            python3 -I "tools/$t.py"
          done
      - name: Ids are permanent (none removed without former_ids or retired.toml)
        # compare with where the branch left main, so records merged to main since then do not count as removed
        run: python3 -I tools/check_ids.py ${{ github.event_name == 'pull_request' && format('$(git merge-base origin/{0} HEAD)', github.base_ref) || 'HEAD^' }}
      - name: No data regressions (a removed or changed value a source stated)
        # reports on every PR; fails unless the PR body has a "Regressions: expected" line with a reason
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          rc=0
          python3 -I tools/regression_check.py --base "origin/$BASE_REF" --head HEAD \
            --body "$RUNNER_TEMP/pr-body.md" --markdown "$RUNNER_TEMP/regression-summary.md" \
            --report "$RUNNER_TEMP/regression-report.tsv" || rc=$?
          cat "$RUNNER_TEMP/regression-summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Keep the regression report as a build artifact
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-report
          path: ${{ runner.temp }}/regression-report.tsv
          retention-days: 14
          if-no-files-found: ignore
      - name: Build the JSON export
        run: python3 -I tools/export.py dist/hobbydex-rc.json
      - name: Keep the export as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: hobbydex-rc-export
          path: dist/hobbydex-rc.json
          retention-days: 14
