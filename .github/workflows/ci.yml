name: Validate data

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate every TOML file under data/
        run: python3 -I tools/validate.py
      - name: Build the JSON export
        run: python3 -I tools/export.py dist/hobbydex-rc.json
      - name: Keep the export as a build artifact
        uses: actions/upload-artifact@v6
        with:
          name: hobbydex-rc-export
          path: dist/hobbydex-rc.json
          retention-days: 14
