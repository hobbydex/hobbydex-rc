name: Validate data

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # check_ids compares with the base revision
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Only known file types may be tracked
        run: |
          bad=$(git ls-files | grep -vE '^(data/.+\.toml|data/LICENSE|docs/[^/]+\.md|tools/[^/]+\.py|\.github/workflows/[^/]+\.yml|\.github/dependabot\.yml|README\.md|LICENSE|\.gitignore)$' || true)
          if [ -n "$bad" ]; then
            echo "files of a type this repository does not accept:" >&2
            echo "$bad" >&2
            exit 1
          fi
      - name: Validate every TOML file under data/
        run: python3 -I tools/validate.py
      - name: Ids are permanent (none removed without former_ids or retired.toml)
        # compare with where the branch left main, so records merged to main since then do not count as removed
        run: python3 -I tools/check_ids.py ${{ github.event_name == 'pull_request' && format('$(git merge-base origin/{0} HEAD)', github.base_ref) || 'HEAD^' }}
      - name: Build the JSON export
        run: python3 -I tools/export.py dist/hobbydex-rc.json
      - name: Keep the export as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: hobbydex-rc-export
          path: dist/hobbydex-rc.json
          retention-days: 14
